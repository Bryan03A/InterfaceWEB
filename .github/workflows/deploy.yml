name: Deploy to EC2 on Push

on:
  push:
    branches:
      - test  # o 'test' si trabajas con la rama 'test'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 3.227.120.143
          username: ec2-user               # o ubuntu, depende de tu AMI
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
                  # Clonar o actualizar repo
                  if [ -d ~/InterfaceWEB ]; then
                    cd ~/InterfaceWEB
                    git pull origin main
                  else
                    git clone https://github.com/Bryan03A/InterfaceWEB.git ~/InterfaceWEB
                    cd ~/InterfaceWEB
                  fi

                  # Entrar a interface-service
                  cd interface-service

                  # Instalar dependencias
                  npm install

                  # Detener si está corriendo la app anterior
                  pm2 delete interface-service || true

                  # Iniciar app con pm2
                  pm2 start server.js --name interface-service

                  # Guardar proceso pm2 para reinicio automático
                  pm2 save