name: Deploy to EC2 on Push

on:
  push:
    branches:
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 34.236.169.1
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Ruta de instalación local
            export NODE_DIR=$HOME/.local-node
            export PATH=$NODE_DIR/bin:$PATH

            # Instalar Node.js local si no existe
            if ! command -v node >/dev/null 2>&1; then
              echo "⚙️ Instalando Node.js localmente..."
              mkdir -p $NODE_DIR
              curl -fsSL https://nodejs.org/dist/v18.18.2/node-v18.18.2-linux-x64.tar.xz -o node.tar.xz
              tar -xf node.tar.xz -C $NODE_DIR --strip-components=1
              rm node.tar.xz
            else
              echo "✅ Node.js detectado: $(node -v)"
            fi

            # Confirmar que node y npm están accesibles
            echo "🟢 Node.js path: $(which node)"
            echo "🟢 NPM path: $(which npm)"

            # Clonar o actualizar el repositorio
            if [ -d ~/InterfaceWEB ]; then
              cd ~/InterfaceWEB
              git pull origin test
            else
              git clone -b test https://github.com/Bryan03A/InterfaceWEB.git ~/InterfaceWEB
              cd ~/InterfaceWEB
            fi

            # Instalar dependencias (incluye pm2 local)
            npm install

            # Detener instancia previa si existe
            npx pm2 delete interface-service || true

            # Iniciar app con PM2 local
            npx pm2 start server.js --name interface-service

            # Guardar configuración
            npx pm2 save
