name: Deploy to EC2 on Push

on:
  push:
    branches:
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 34.236.169.1
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Verificar si Node.js está instalado
            if ! command -v node >/dev/null 2>&1; then
              echo "❌ Node.js no está instalado. Aborta el despliegue."
              exit 1
            fi

            echo "✅ Node.js detectado: $(node -v)"

            # Clonar o actualizar el repositorio
            if [ -d ~/InterfaceWEB ]; then
              cd ~/InterfaceWEB
              git pull origin test
            else
              git clone -b test https://github.com/Bryan03A/InterfaceWEB.git ~/InterfaceWEB
              cd ~/InterfaceWEB
            fi

            # Instalar dependencias (incluye pm2 local)
            npm install

            # Detener instancia previa si existe
            npx pm2 delete interface-service || true

            # Iniciar app con PM2 local
            npx pm2 start server.js --name interface-service

            # Guardar configuración (procesos y ecosistema)
            npx pm2 save