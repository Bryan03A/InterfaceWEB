<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Responsive Search Bar</title>
<style>
  .search-bar {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px;
    border-radius: 10px;
    background-color: #ffffff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    max-width: 900px;
    margin: 20px auto;
  }

  .search-bar input,
  .search-bar select {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    width: 100%;
    box-sizing: border-box;
  }

  .search-bar button {
    padding: 10px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    width: 100%;
  }

  .search-bar button:hover {
    background-color: #0056b3;
  }

  .search-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .search-options label {
    font-weight: 600;
  }

  @media (min-width: 768px) {
    .search-bar {
      flex-direction: row;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .search-bar input,
    .search-bar select,
    .search-bar button {
      width: auto;
      flex: 1 1 150px;
      min-width: 150px;
    }

    .search-options {
      flex-direction: row;
      align-items: center;
      gap: 12px;
    }

    .search-options label {
      margin-right: 6px;
      white-space: nowrap;
    }

    .search-bar button {
      flex: 0 0 auto;
      min-width: 100px;
      width: auto;
    }
  }
</style>
</head>
<body>

<div class="search-bar">
  <input type="text" id="searchQuery" placeholder="Search model..." />
  <input type="text" id="creatorFilter" placeholder="Filter by creator..." />

  <div class="search-options">
    <label for="sortBy">Sort by:</label>
    <select id="sortBy">
      <option value="name">Name</option>
      <option value="price">Price</option>
    </select>

    <label for="order">Order:</label>
    <select id="order">
      <option value="asc">Ascending</option>
      <option value="desc">Descending</option>
    </select>
  </div>

  <button onclick="searchModels()">🔍 Search</button>
</div>

<script>
function searchModels() {
  alert('Search function triggered');
}
</script>

</body>
</html>
