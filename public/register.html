<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro con Foto de Perfil</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <!-- Barra de navegación -->
    <nav>
        <div class="navbar">
            <div class="logo">
                <a href="index.html">3D Model Shop</a>
            </div>
            <div class="nav-links">
                <ul>
                    <li><a href="catalog.html" class="nav-link">Add</a></li>
                    <li id="course-status-link"></li>
                    <li id="login-register-link">
                        <a href="login.html">Login</a> / <span id="course-status">Course...</span>
                    </li>
                    <li id="user-settings" style="display: none;">
                        <span id="settings-icon">&#9881;</span>
                        <div id="settings-dropdown" class="dropdown">
                            <a href="profile.html">Profile</a>
                            <a href="bought.html">Bought</a>
                            <a href="#" id="logout-link">Logout</a>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="left-panel">
            <h3>Foto de Perfil</h3>
            <img id="profilePreview" class="profile-preview" src="images/default-avatar.png" alt="Vista previa de la imagen">
            <label for="profile_image">Sube tu Foto de Perfil</label>
            <input type="file" id="profile_image" accept="image/*" onchange="previewImage(event)">
        </div>
        <div class="right-panel">
            <h2>Registro de Usuario</h2>
            <form onsubmit="registerUser(event)">
                <label>Usuario:</label>
                <input type="text" id="username" required>

                <label>Contraseña:</label>
                <input type="password" id="password" required>

                <label>Nombre:</label>
                <input type="text" id="first_name" required>

                <label>Apellido:</label>
                <input type="text" id="last_name" required>

                <label>DNI:</label>
                <input type="text" id="dni" required>

                <label>Email:</label>
                <input type="email" id="email" required>

                <label>Ciudad:</label>
                <input type="text" id="city" required>

                <button type="submit">Registrar</button>
            </form>
        </div>
    </div>
    
    <!-- Footer -->
    <footer>
        <p>&copy; 2025 3D Model Shop. Todos los derechos reservados.</p>
    </footer>
    
    <script>
    async function registerUser(event) {
        event.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const first_name = document.getElementById("first_name").value;
        const last_name = document.getElementById("last_name").value;
        const dni = document.getElementById("dni").value;
        const email = document.getElementById("email").value;
        const city = document.getElementById("city").value;
        const profileImage = document.getElementById("profile_image").files[0];

        const soapRequest = `
        <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:user="http://example.com/user">
            <soapenv:Header/>
            <soapenv:Body>
            <user:RegisterUser>
                <user:username>${username}</user:username>
                <user:password>${password}</user:password>
                <user:first_name>${first_name}</user:first_name>
                <user:last_name>${last_name}</user:last_name>
                <user:dni>${dni}</user:dni>
                <user:email>${email}</user:email>
                <user:city>${city}</user:city>
            </user:RegisterUser>
            </soapenv:Body>
        </soapenv:Envelope>
        `;

        try {
        const response = await fetch("http://34.193.65.142:5002/register", {
            method: "POST",
            headers: { "Content-Type": "text/xml" },
            body: soapRequest
        });

        const responseText = await response.text();
        console.log("Respuesta SOAP:", responseText);

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(responseText, "text/xml");
        const message = xmlDoc.getElementsByTagName("us:message")[0]?.textContent;
        const errorCode = xmlDoc.getElementsByTagName("us:error")[0]?.textContent;

        if (errorCode === "user_username_key") {
            alert(message || "El nombre de usuario ya está ocupado.");
            return;
        }

        const userId = xmlDoc.getElementsByTagName("us:id")[0]?.textContent;

        if (!userId) {
            alert("Error: No se pudo obtener el ID del usuario.");
            console.error("Respuesta sin ID:", responseText);
            return;
        }

        console.log("Nuevo ID de usuario:", userId);

        const formData = new FormData();

        if (profileImage) {
            formData.append("file", profileImage, `${userId}.png`);
        } else {
            const defaultImage = await fetch("images/default-avatar.png");
            const defaultBlob = await defaultImage.blob();
            formData.append("file", defaultBlob, `${userId}.png`);
        }

        const uploadResponse = await fetch("http://54.243.94.215:5015/upload_image", {
            method: "POST",
            body: formData
        });

        if (uploadResponse.ok) {
            alert("Usuario registrado y foto de perfil subida con éxito.");
        } else {
            alert("Usuario registrado, pero hubo un error al subir la imagen.");
        }

        } catch (error) {
        console.error("Error en el registro:", error);
        alert("Hubo un error al registrar el usuario.");
        }
    }
    </script>
</body>
</html>
